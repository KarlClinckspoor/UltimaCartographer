<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultima Underworld viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e4e1d6; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #panel { position: absolute; top: 10px; left: 10px; background: rgba(22,23,20,.88); border: 1px solid #34352f; border-radius: 8px; padding: 10px 12px; width: 280px; }
  #panel h1 { font: 600 16px Georgia, serif; color: #e0b354; margin: 0 0 8px; }
  #panel h1 a { color: inherit; text-decoration: none; }
  #panel label { display: block; margin: 6px 0 2px; color: #9a978b; font-size: 12px; }
  select, input[type=range] { width: 100%; }
  select { background: #23241f; color: #e4e1d6; border: 1px solid #34352f; border-radius: 4px; padding: 4px; }
  #status, #help { color: #9a978b; font-size: 12px; margin-top: 8px; white-space: pre-line; }
  #info { position: absolute; right: 10px; top: 10px; background: rgba(22,23,20,.92); border: 1px solid #34352f; border-radius: 8px; padding: 10px 12px; width: 330px; max-height: 80vh; overflow: auto; display: none; }
  #info h2 { margin: 0 0 6px; font: 600 15px Georgia, serif; color: #e0b354; }
  #info ul { margin: 4px 0; padding-left: 18px; } #info li { margin: 3px 0; }
  #info .muted { color: #9a978b; font-size: 12px; }
  #info a { color: #e0b354; }
  button { margin: 4px 4px 0 0; background: #23241f; color: #e4e1d6; border: 1px solid #34352f; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .row label { display: flex; gap: 4px; align-items: center; margin: 0; color: #e4e1d6; font-size: 13px; }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="panel">
  <h1><a href="../" title="Back to the Cartographer">Ultima Underworld</a></h1>
  <label for="game">Game</label>
  <select id="game"><option value="uw1">Ultima Underworld</option><option value="uw2">Ultima Underworld II</option></select>
  <label for="level">Level</label>
  <select id="level"></select>
  <label for="light">Light</label>
  <select id="light"></select>
  <label for="speed">Speed: <span id="speedv"></span> tiles a second</label>
  <input type="range" id="speed">
  <label>Show</label>
  <div class="row">
    <label><input type="checkbox" id="ceiling" checked>Ceiling</label>
    <label><input type="checkbox" id="objects" checked>Objects</label>
    <label><input type="checkbox" id="hidden">Hidden things</label>
  </div>
  <div id="status">Loading…</div>
  <div id="help">Drag: look · WASD: move · Q/E: down/up · Shift: 4× faster · wheel or slider: speed · T: from above · click: what is there</div>
</div>
<div id="info"></div>
<script type="module" src="viewer.js"></script>
</body>
</html>
