<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultima IX viewer</title>
<!-- the Cartographer's icon: without one the browser asks for /favicon.ico at the domain root -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23121310'/%3E%3Cpath d='M3 12L8 3l5 9z' fill='none' stroke='%23e0b354' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0b0c0a; color: #e4e1d6; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #panel { position: absolute; top: 10px; left: 10px; background: rgba(22,23,20,.88); border: 1px solid #34352f; border-radius: 8px; padding: 10px 12px; max-width: 320px; }
  #panel h1 { font: 600 16px Georgia, serif; color: #e0b354; margin: 0 0 8px; }
  #panel label { display: block; margin: 6px 0 2px; color: #9a978b; font-size: 12px; }
  select, input[type=range] { width: 100%; }
  select { background: #23241f; color: #e4e1d6; border: 1px solid #34352f; border-radius: 4px; padding: 4px; }
  #status, #help { color: #9a978b; font-size: 12px; margin-top: 8px; white-space: pre-line; }
  #info { position: absolute; right: 10px; top: 10px; background: rgba(22,23,20,.92); border: 1px solid #34352f; border-radius: 8px; padding: 10px 12px; max-width: 340px; display: none; }
  #info h2 { margin: 0 0 6px; font: 600 15px Georgia, serif; color: #e0b354; }
  #info button { margin: 4px 4px 0 0; background: #23241f; color: #e4e1d6; border: 1px solid #34352f; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=checkbox] { margin: 0; }
  /* touch: drag to turn (no page scrolling on the canvas), a button to walk forward, a panel that folds away */
  canvas { touch-action: none; }
  #walk { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; font: 600 16px system-ui, sans-serif;
    padding: 14px 26px; border-radius: 30px; background: rgba(22,23,20,.85); color: #e4e1d6; border: 2px solid #34352f; }
  #walk.on { background: #e0b354; color: #1a1a14; border-color: #e0b354; }
  @media (pointer: coarse) { #walk { display: block; } }
  #fold { float: right; margin: -2px 0 0 8px; padding: 0 8px; font-size: 14px; line-height: 20px; }
  #panel.folded > :not(h1) { display: none; }
  @media (max-width: 600px) { #panel { width: auto; max-width: calc(100vw - 44px); } #info { width: auto; left: 10px; top: auto; bottom: 80px; max-height: 45vh; } }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="panel">
  <h1><button id="fold" title="Fold the panel">–</button><a href="../" title="Back to the Cartographer" style="color:inherit;text-decoration:none">Ultima IX</a></h1>
  <label for="map">Map</label>
  <select id="map"></select>
  <label>Show</label>
  <div class="row"><input type="checkbox" id="models" checked><span>Objects</span>
    <input type="checkbox" id="water" checked><span>Water</span></div>
  <label for="dist">Draw distance <span id="distv"></span></label>
  <input type="range" id="dist" min="32" max="1024" value="256">
  <div id="status">Loading…</div>
  <div id="help">Drag: look · WASD (or the Walk button on touch screens): move · Q/E: down/up · Shift: faster · wheel: speed · T: top-down · click: what is there</div>
</div>
<div id="info"></div>
<button id="walk" title="Walk forward (drag to turn)">▲ Walk</button>
<script type="module" src="viewer.js"></script>
</body>
</html>
